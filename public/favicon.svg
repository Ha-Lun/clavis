<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background gradient -->
    <radialGradient id="bg" cx="50%" cy="40%" r="70%">
      <stop offset="0%" stop-color="#1A1714"/>
      <stop offset="100%" stop-color="#0D0B09"/>
    </radialGradient>

    <!-- Gold gradient for the key -->
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#D4A853"/>
      <stop offset="50%" stop-color="#A87C3E"/>
      <stop offset="100%" stop-color="#8B6530"/>
    </linearGradient>

    <!-- Highlight gradient -->
    <linearGradient id="goldHighlight" x1="0.3" y1="0" x2="0.7" y2="1">
      <stop offset="0%" stop-color="#F0D68A"/>
      <stop offset="100%" stop-color="#C49A4A"/>
    </linearGradient>

    <!-- Subtle glow filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feFlood flood-color="#A87C3E" flood-opacity="0.25"/>
      <feComposite in2="blur" operator="in"/>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background: rounded square -->
  <rect width="512" height="512" rx="160" fill="url(#bg)"/>

  <!-- Subtle border -->
  <rect x="2" y="2" width="508" height="508" rx="158" fill="none" stroke="#A87C3E" stroke-opacity="0.12" stroke-width="2"/>

  <!-- Key icon group — centered, elegant skeleton key -->
  <g transform="translate(256, 256)" filter="url(#glow)">
    <!-- Key bow (circular head) -->
    <circle cx="0" cy="-100" r="72" fill="none" stroke="url(#gold)" stroke-width="24"/>
    <circle cx="0" cy="-100" r="72" fill="none" stroke="url(#goldHighlight)" stroke-width="8" stroke-opacity="0.3"/>

    <!-- Inner ornamental ring -->
    <circle cx="0" cy="-100" r="40" fill="none" stroke="url(#gold)" stroke-width="10"/>

    <!-- Key shaft -->
    <rect x="-12" y="-28" width="24" height="200" rx="4" fill="url(#gold)"/>

    <!-- Shaft highlight -->
    <rect x="-4" y="-28" width="8" height="200" rx="2" fill="url(#goldHighlight)" fill-opacity="0.2"/>

    <!-- Key ward (bit) — bottom teeth -->
    <g>
      <!-- Main horizontal ward -->
      <rect x="12" y="130" width="56" height="18" rx="3" fill="url(#gold)"/>
      <!-- Upper tooth -->
      <rect x="12" y="100" width="40" height="18" rx="3" fill="url(#gold)"/>
      <!-- Bottom step -->
      <rect x="12" y="156" width="32" height="16" rx="3" fill="url(#gold)"/>
    </g>
  </g>
</svg>
